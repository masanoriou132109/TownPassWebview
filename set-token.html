<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 JWT Token</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    button {
      background: #5ab4c5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #318ea0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .info {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .token-preview {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 设置 JWT Token</h1>
    
    <div class="info">
      <strong>说明：</strong><br>
      此页面将使用测试数据自动获取 JWT Token 并保存到 localStorage。<br>
      设置完成后，所有 API 调用将自动使用此 Token。
    </div>

    <div id="status" class="status" style="display: none;"></div>

    <button id="setTokenBtn" onclick="setToken()">获取并设置 JWT Token</button>
    <button onclick="checkToken()" style="background: #6c757d; margin-top: 10px;">检查当前 Token</button>
    <button onclick="clearToken()" style="background: #dc3545; margin-top: 10px;">清除 Token</button>

    <div id="tokenInfo" style="display: none; margin-top: 20px;">
      <h3>Token 信息</h3>
      <div class="token-preview" id="tokenPreview"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://ws10.csie.ntu.edu.tw:54443';
    const ID = '7f3562f4-bb3f-4ec7-89b9-da3b4b5ff250';
    const ID_NO = 'A123456789';

    function showStatus(message, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.className = `status ${type}`;
      statusDiv.textContent = message;
      statusDiv.style.display = 'block';
    }

    async function setToken() {
      const btn = document.getElementById('setTokenBtn');
      btn.disabled = true;
      showStatus('正在获取 JWT Token...', 'loading');

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            uuid: ID,
            idNo: ID_NO,
          }),
        });

        const data = await response.json();

        if (data.success && data.data && data.data.token) {
          const token = data.data.token;
          localStorage.setItem('token', token);
          localStorage.setItem('userId', ID);
          localStorage.setItem('idNo', ID_NO);

          showStatus('✅ JWT Token 已成功设置到 localStorage！', 'success');
          
          document.getElementById('tokenInfo').style.display = 'block';
          document.getElementById('tokenPreview').textContent = 
            `Token: ${token.substring(0, 50)}...\n` +
            `用户: ${data.data.user?.name || 'N/A'}\n` +
            `账号: ${data.data.user?.account || 'N/A'}`;
        } else {
          showStatus('❌ 无法获取 Token: ' + (data.message || JSON.stringify(data)), 'error');
        }
      } catch (error) {
        showStatus('❌ 请求失败: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function checkToken() {
      const token = localStorage.getItem('token');
      if (token) {
        showStatus('✅ 当前已有 Token 存储在 localStorage', 'success');
        document.getElementById('tokenInfo').style.display = 'block';
        document.getElementById('tokenPreview').textContent = 
          `Token: ${token.substring(0, 50)}...\n` +
          `完整长度: ${token.length} 字符`;
      } else {
        showStatus('❌ localStorage 中没有 Token', 'error');
        document.getElementById('tokenInfo').style.display = 'none';
      }
    }

    function clearToken() {
      localStorage.removeItem('token');
      localStorage.removeItem('userId');
      localStorage.removeItem('idNo');
      showStatus('🗑️ Token 已清除', 'success');
      document.getElementById('tokenInfo').style.display = 'none';
    }

    // 页面加载时自动检查
    window.addEventListener('load', () => {
      checkToken();
    });
  </script>
</body>
</html>
